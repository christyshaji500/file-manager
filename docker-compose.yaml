services:

  postgres:
    image: postgres:17
    container_name: file-manager-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: filemanager_dev

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: file-manager-backend

    depends_on:
      - postgres

    ports:
      - "5000:5000"

    environment:
      PORT: 5000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: filemanager_dev

      JWT_SECRET: christy-secret-key@2026

      AWS_REGION: eu-north-1
      AWS_ACCESS_KEY_ID: AKIA4WFSVRM6JIY6LUEN
      AWS_SECRET_ACCESS_KEY: i1AXzJ8aa2CNJf6UhHte88fq4f30tl4u4oi436f
      AWS_BUCKET_NAME: christy-file-manager-2026

  frontend:
      build: ./frontend

      container_name: file-manager-frontend

      depends_on:
        - backend

      ports:
        - "3000:3000"

volumes:
  postgres_data: